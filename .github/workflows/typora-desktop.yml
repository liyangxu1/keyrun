name: Build Typora desktop tools

on:
  push:
    branches: [main]
    paths:
      - 'tools/typora-desktop/**'
      - 'scripts/typora-linux.sh'
      - 'scripts/typora-windows.ps1'
      - '.github/workflows/typora-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typora-desktop-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/typora-desktop/go.mod
          cache: false
      - name: 测试并构建发布文件
        working-directory: tools/typora-desktop
        env:
          CGO_ENABLED: '0'
        run: |
          set -eu
          go test ./...
          mkdir -p ../../dist
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" go build -trimpath -o "../../dist/typora-windows-$arch.exe" .
            GOOS=linux GOARCH="$arch" go build -trimpath -o "../../dist/typora-linux-$arch" .
          done
          cd ../../dist
          sha256sum typora-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: typora-desktop
          path: dist/

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: typora-desktop
          path: dist
      - name: 更新固定下载地址
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag=typora-desktop
          notes="构建提交：$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/typora-* --clobber
            gh release upload "$tag" dist/SHA256SUMS --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title 'Typora Windows / Linux' --notes "$notes" dist/*
          fi
